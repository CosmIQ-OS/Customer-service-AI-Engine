services:
  engine:
    build: .
    image: cosmiq-support-engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3001"
      DB_PATH: /app/data/pglite
    ports:
      - "3001:3001"
    volumes:
      - engine-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  invoice-ninja-app:
    image: invoiceninja/invoiceninja-debian:5.13.56
    restart: unless-stopped
    profiles: [invoicing]
    env_file:
      - .env
    volumes:
      - invoice-ninja-public:/var/www/html/public
      - invoice-ninja-storage:/var/www/html/storage
    depends_on:
      invoice-ninja-db:
        condition: service_healthy
      invoice-ninja-redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  invoiceninja:
    image: nginx:1.29-alpine
    restart: unless-stopped
    profiles: [invoicing]
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/invoice-ninja/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - invoice-ninja-public:/var/www/html/public:ro
      - invoice-ninja-storage:/var/www/html/storage:ro
    depends_on:
      invoice-ninja-app:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

  invoice-ninja-db:
    image: mysql:8.4
    restart: unless-stopped
    profiles: [invoicing]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-invoiceninja}
      MYSQL_USER: ${DB_USERNAME:-invoiceninja}
      # Fail closed: never boot MySQL with blank/root-less credentials.
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (generate a unique value)}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env (generate a unique value)}
    volumes:
      - invoice-ninja-mysql:/var/lib/mysql
    healthcheck:
      # No credential on the command line (keeps it out of the process list).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  invoice-ninja-redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: [invoicing]
    volumes:
      - invoice-ninja-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  # Optional public tunnel. Set CLOUDFLARE_TUNNEL_TOKEN in .env to enable it.
  # The token is passed through the environment, not the command line, so it
  # never shows up in the container's process list.
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - engine
    profiles:
      - tunnel
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  engine-data:
  invoice-ninja-public:
  invoice-ninja-storage:
  invoice-ninja-mysql:
  invoice-ninja-redis-data:
