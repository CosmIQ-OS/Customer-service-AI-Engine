services:
  engine:
    build: .
    image: cosmiq-support-engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3001"
      DB_PATH: /app/data/pglite
    ports:
      - "3001:3001"
    volumes:
      - engine-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Optional public tunnel. Set CLOUDFLARE_TUNNEL_TOKEN in .env to enable it.
  # The token is passed through the environment, not the command line, so it
  # never shows up in the container's process list.
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - engine
    profiles:
      - tunnel
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  engine-data:
