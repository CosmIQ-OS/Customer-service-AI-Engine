name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci && npm --prefix dashboard ci

      - name: Typecheck all projects
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Golden conversation evals
        run: npm run eval

      - name: Build backend and dashboard
        run: npm run build && npm run dashboard:build
